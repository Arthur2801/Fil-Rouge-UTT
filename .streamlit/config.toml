# ==============================================================================
# Configuration Streamlit Cloud
# ==============================================================================
# Force l'utilisation de pip au lieu de uv pour éviter les conflits
# avec l'index PyTorch CPU et certifi
# ==============================================================================

[runner]
# Force l'utilisation de pip comme gestionnaire de paquets
# uv a des problèmes avec --extra-index-url et la résolution de certifi
magicEnabled = true

[server]
# Configuration du serveur pour éviter les problèmes de connexion
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
